name = "plotforks-counter"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# No logs, no traces: the counter must not keep anything but the aggregate numbers.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "plotforks-counter"
database_id = "0323e812-e152-47e9-b300-630851a82517"

# Weekly compaction: daily rows older than 35 days are folded into one "archive" row per key.
[triggers]
crons = ["17 3 * * SUN"]
